<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nati on Tour — WM 2026</title>
  <meta name="description" content="Schweiz an der WM 2026 — Reiseplaner: Achtelfinale Vancouver, Flüge, Weiterreise, Turnierbaum." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-badge"><img src="https://flagcdn.com/w40/ch.png" alt="CH" /></span>
      <div>
        <h1>NATI <span class="thin">ON TOUR</span></h1>
        <p class="brand-sub" id="asOfLine">WM 2026 · USA · Kanada · Mexiko</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="mergeBtn" title="Resultate live von Wikipedia aktualisieren">↻ <span class="hide-sm">Aktualisieren</span></button>
    </div>
  </header>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-view="trip"><span class="nav-ic">✈️</span> Mein Trip</button>
    <button class="nav-btn" data-view="bracket"><span class="nav-ic">🏆</span> Turnierbaum</button>
    <button class="nav-btn" data-view="map"><span class="nav-ic">🗺️</span> Karte</button>
  </nav>

  <main id="main">
    <section class="view" id="view-trip"></section>

    <section class="view" id="view-bracket" hidden></section>

    <section class="view" id="view-map" hidden>
      <div id="map"></div>
      <p class="map-note">Nur noch stattfindende Spiele · <span class="route-chip">— rote Route = möglicher Weg der Nati</span></p>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="data/fixtures.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
